server:
  port: 8080
  # nginx 가 넘겨주는 X-Forwarded-* 를 반영해서 스킴/호스트를 올바르게 인식합니다.
  # (이게 없으면 HTTPS 요청도 http:8080 으로 보여서 동일 출처를 교차 출처로 오판합니다)
  # 전제: 백엔드는 항상 nginx 뒤에 있어야 하며, 8080 을 외부에 직접 노출하지 않습니다.
  forward-headers-strategy: framework

# CORS: 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 도메인 지정 (쉼표 구분)
# allowedOriginPatterns 를 쓰므로 http://localhost:[*] 같은 포트 와일드카드도 가능합니다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://xn--vg1b002am5bc0y3ga.com,https://www.xn--vg1b002am5bc0y3ga.com,http://localhost:[*],http://127.0.0.1:[*]}

# 관리자 계정/토큰 (실제 값은 .env 로 주입)
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:8593}
  # 미설정 시 기동할 때마다 임의 키를 생성합니다(재기동하면 재로그인 필요)
  token-secret: ${ADMIN_TOKEN_SECRET:}
  token-ttl-hours: ${ADMIN_TOKEN_TTL_HOURS:12}

spring:
  application:
    name: api-server
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/newspaper?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: ${MAIL_HOST:imap.naver.com}
    port: ${MAIL_PORT:993}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        store:
          protocol: imaps
        imaps:
          ssl:
            enable: true
            trust: "*"

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

cloud:
  aws:
    credentials:
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
    s3:
      endpoint: ${CLOUD_AWS_S3_ENDPOINT:http://localhost:9000}
      bucket: ${MINIO_BUCKET:newspaper-bucket}
    region:
      static: ${MINIO_REGION:us-east-1}
    stack:
      auto: false

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  enabled: ${GEMINI_ENABLED:true}

logging:
  level:
    com.newspaper.api_server.service.GeminiService: DEBUG
