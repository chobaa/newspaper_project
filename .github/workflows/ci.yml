name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Run Gradle tests
        working-directory: src/api-server
        run: ./gradlew test

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/newspaper-frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/newspaper-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: src/newspaper-frontend
        run: npm test
