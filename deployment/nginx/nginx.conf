upstream backend {
    server backend:8080;
    keepalive 32;
}

# 로컬/직접 접속용 (localhost, IP) — SSL 없이 80으로 서비스
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;
    client_max_body_size 50M;

    root /usr/share/nginx/html/primary;
    index index.html;

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 해시가 붙은 정적 자산(index-<hash>.js 등)은 내용이 바뀌면 파일명도 바뀐다.
    # 그래서 오래 캐싱해도 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 재검증해야 한다.
    # 이게 없으면 브라우저가 옛 index.html 을 계속 들고 있어서,
    # 새로 배포한 번들(파일명이 바뀐)을 영영 내려받지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 프로덕션 도메인: HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name xn--vg1b002am5bc0y3ga.com www.xn--vg1b002am5bc0y3ga.com;
    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443)
server {
    listen 443 ssl;
    server_name xn--vg1b002am5bc0y3ga.com www.xn--vg1b002am5bc0y3ga.com;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/xn--vg1b002am5bc0y3ga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--vg1b002am5bc0y3ga.com/privkey.pem;

    root /usr/share/nginx/html/primary;
    index index.html;

    location /api/ {
        proxy_pass http://backend/api/;
